<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-canvas-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="50%" stop-color="#0D1629" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="card-inner-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#0C1322" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Keyframe Animations -->
    <style>
      @keyframes dash-flow-3 {
        0% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes token-glow {
        0%, 100% { filter: drop-shadow(0 0 4px #8B5CF6); }
        50% { filter: drop-shadow(0 0 10px #C084FC); }
      }
      @keyframes pulse-gate {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.02); opacity: 1; }
      }
      .anim-dash-3 {
        stroke-dasharray: 6, 6;
        animation: dash-flow-3 2.5s linear infinite;
      }
      .glow-token {
        animation: token-glow 3s ease-in-out infinite;
      }
      .gate-pulse {
        animation: pulse-gate 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="980" height="440" fill="url(#bg-canvas-3)" rx="14" />
  
  <!-- Subtle Grid -->
  <g stroke="#16233B" stroke-width="0.7" opacity="0.45">
    <path d="M 0,55 L 980,55 M 0,110 L 980,110 M 0,165 L 980,165 M 0,220 L 980,220 M 0,275 L 980,275 M 0,330 L 980,330 M 0,385 L 980,385" />
    <path d="M 140,0 L 140,440 M 280,0 L 280,440 M 420,0 L 420,440 M 560,0 L 560,440 M 700,0 L 700,440 M 840,0 L 840,440" />
  </g>

  <!-- Frame -->
  <rect x="8" y="8" width="964" height="424" fill="none" stroke="#253550" stroke-width="1.2" rx="12" />

  <!-- Diagram Title Header -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="36" height="24" rx="4" fill="#8B5CF6" />
    <text x="18" y="16" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="12" text-anchor="middle">03</text>
    <text x="46" y="17" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="16">
      No-Code Natural Language Rule Studio &amp; AST Compiler
    </text>
    <text x="590" y="16" fill="#C4B5FD" font-family="'Inter', sans-serif" font-weight="600" font-size="11">
      Plain-English Policy Authoring • Dynamic Simulation • Zero-Downtime Deployment
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- STEP 1: HUMAN NATURAL LANGUAGE PROMPT (X=30 to 220) -->
  <!-- ============================================================== -->
  <g transform="translate(30, 68)">
    <rect x="0" y="0" width="190" height="340" rx="8" fill="url(#card-inner-3)" stroke="#1F2E47" stroke-width="1" />
    
    <rect x="0" y="0" width="190" height="34" rx="8" fill="#151A2E" stroke="#1F2E47" stroke-width="1" />
    <text x="14" y="22" fill="#A5B4FC" font-family="'Inter', sans-serif" font-weight="700" font-size="11">
      1. NATURAL LANGUAGE
    </text>

    <!-- Prompt Box -->
    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="162" height="150" rx="6" fill="#090E1B" stroke="#8B5CF6" stroke-width="1.2" />
      <text x="10" y="18" fill="#C4B5FD" font-family="'Inter', sans-serif" font-weight="800" font-size="9">
        ANALYST PROMPT INPUT:
      </text>

      <rect x="10" y="28" width="142" height="76" rx="4" fill="#131B30" />
      <text x="16" y="46" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600">
        "Flag any housing
      </text>
      <text x="16" y="62" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600">
        allowance exceeding
      </text>
      <text x="16" y="78" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700">
        12000 AED for
      </text>
      <text x="16" y="94" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700">
        Grade 6 or below"
      </text>

      <text x="10" y="120" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8">Author: HR Compliance Lead</text>
      <text x="10" y="134" fill="#10B981" font-family="'Inter', sans-serif" font-size="8" font-weight="600">✔ Syntax: Conversational English</text>
    </g>

    <!-- Quick Presets -->
    <g transform="translate(14, 210)">
      <rect x="0" y="0" width="162" height="110" rx="6" fill="#0C1322" stroke="#253550" stroke-width="1" />
      <text x="10" y="18" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5">PRE-SET EXAMPLES:</text>
      <text x="10" y="36" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8">• Sick leave &gt; 3 days no DHA</text>
      <text x="10" y="52" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8">• Amount &gt; 35k in Catering</text>
      <text x="10" y="68" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8">• 20k Salary hike by Grade 8</text>
      <rect x="10" y="80" width="142" height="20" rx="3" fill="#1E293B" />
      <text x="81" y="93" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="8" font-weight="700" text-anchor="middle">
        NO PYTHON / SQL CODING
      </text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220,180 L 268,180" fill="none" stroke="#8B5CF6" stroke-width="2" class="anim-dash-3" />

  <!-- ============================================================== -->
  <!-- STEP 2: ENTITY EXTRACTION & TOKENIZER (X=270 to 470) -->
  <!-- ============================================================== -->
  <g transform="translate(270, 68)">
    <rect x="0" y="0" width="200" height="340" rx="8" fill="url(#card-inner-3)" stroke="#8B5CF6" stroke-width="1" />
    
    <rect x="0" y="0" width="200" height="34" rx="8" fill="#1B172E" stroke="#8B5CF6" stroke-width="1" />
    <text x="14" y="22" fill="#C4B5FD" font-family="'Inter', sans-serif" font-weight="700" font-size="11">
      2. TOKENIZER &amp; NER EXTRACTION
    </text>

    <!-- Extracted Chips -->
    <g transform="translate(14, 46)">
      
      <!-- Token 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="172" height="52" rx="5" fill="#0C1222" stroke="#38BDF8" stroke-width="1" />
        <text x="10" y="16" fill="#7DD3FC" font-family="'Inter', sans-serif" font-weight="700" font-size="8">TARGET TRANSACTION ENTITY</text>
        <rect x="10" y="24" width="152" height="20" rx="3" fill="#0C233C" />
        <text x="86" y="37" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
          type == "Housing Allowance"
        </text>
      </g>

      <!-- Token 2 -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="172" height="52" rx="5" fill="#0C1222" stroke="#F59E0B" stroke-width="1" />
        <text x="10" y="16" fill="#FCD34D" font-family="'Inter', sans-serif" font-weight="700" font-size="8">NUMERICAL THRESHOLD &amp; OP</text>
        <rect x="10" y="24" width="152" height="20" rx="3" fill="#2E1C0A" />
        <text x="86" y="37" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
          amount_aed &gt; 12000.00
        </text>
      </g>

      <!-- Token 3 -->
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="172" height="52" rx="5" fill="#0C1222" stroke="#A855F7" stroke-width="1" />
        <text x="10" y="16" fill="#D8B4FE" font-family="'Inter', sans-serif" font-weight="700" font-size="8">HIERARCHY &amp; GRADE CONSTRAINT</text>
        <rect x="10" y="24" width="152" height="20" rx="3" fill="#241038" />
        <text x="86" y="37" fill="#C084FC" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
