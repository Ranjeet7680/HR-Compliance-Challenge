    </text>

    <!-- Compiled Lambda -->
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="192" height="88" rx="6" fill="#070A12" stroke="#253550" stroke-width="1" />
      <text x="10" y="16" fill="#FCEFD2" font-family="'Inter', sans-serif" font-weight="800" font-size="8.5">COMPILED AST LAMBDA</text>
      <g transform="translate(10, 28)" font-family="'Courier New', monospace" font-size="8" fill="#94A3B8">
        <text x="0" y="0" fill="#C084FC">def</text> <text x="24" y="0" fill="#E2E8F0">evaluate_row(txn):</text>
        <text x="12" y="14" fill="#94A3B8">return (</text>
        <text x="20" y="26" fill="#38BDF8">txn['type'] == 'Housing' and</text>
        <text x="20" y="38" fill="#F59E0B">float(txn['amt']) &gt; 12000 and</text>
        <text x="20" y="50" fill="#A855F7">int(txn['grade']) &lt;= 6</text>
        <text x="12" y="62" fill="#94A3B8">)</text>
      </g>
    </g>

    <!-- Simulation Sandbox -->
    <g transform="translate(14, 142)">
      <rect x="0" y="0" width="192" height="178" rx="6" fill="#0A0F1D" stroke="#3B82F6" stroke-width="1" />
      <text x="10" y="17" fill="#60A5FA" font-family="'Inter', sans-serif" font-weight="800" font-size="9">10,000 TXN SIMULATION</text>
      
      <rect x="10" y="28" width="172" height="42" rx="4" fill="#0C2038" />
      <text x="96" y="46" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="900" text-anchor="middle">
        17 MATCHES (0.17%)
      </text>
      <text x="96" y="60" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="8" font-weight="600" text-anchor="middle">
        Execution Latency: 18ms
      </text>

      <text x="10" y="86" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8" font-weight="700">Sample Flagged Matches:</text>
      <g transform="translate(10, 96)" font-family="'Courier New', monospace" font-size="7.5" fill="#94A3B8">
        <text x="0" y="10" fill="#F8FAFC">TXN-00499: Gr 6 • AED 14,979</text>
        <text x="0" y="24" fill="#F8FAFC">TXN-01298: Gr 5 • AED 16,277</text>
        <text x="0" y="38" fill="#F8FAFC">TXN-01497: Gr 6 • AED 37,245</text>
      </g>

      <rect x="10" y="146" width="172" height="20" rx="3" fill="#065F46" />
      <text x="96" y="159" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="8" font-weight="800" text-anchor="middle">
        ✔ ZERO FALSE POSITIVES TESTED
      </text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 740,180 L 788,180" fill="none" stroke="#10B981" stroke-width="2" class="anim-dash-3" />

  <!-- ============================================================== -->
  <!-- STEP 4: INSTANT DYNAMIC REGISTRY DEPLOYMENT (X=790 to 950) -->
  <!-- ============================================================== -->
  <g transform="translate(790, 68)">
    <rect x="0" y="0" width="160" height="340" rx="8" fill="url(#card-inner-3)" stroke="#10B981" stroke-width="1.2" />
    
    <rect x="0" y="0" width="160" height="34" rx="8" fill="#0C2419" stroke="#10B981" stroke-width="1" />
    <text x="12" y="22" fill="#6EE7B7" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5">
      4. 1-CLICK DEPLOY
    </text>

    <!-- Deploy Action Button Graphic -->
    <g transform="translate(12, 46)">
      <rect x="0" y="0" width="136" height="54" rx="5" fill="#059669" filter="url(#glow-token)" />
      <text x="68" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="10.5" text-anchor="middle">
        DEPLOY TO ENGINE
      </text>
      <text x="68" y="40" fill="#D1FAE5" font-family="'Inter', sans-serif" font-size="8" font-weight="600" text-anchor="middle">
        Active in Continuous Queue
      </text>
    </g>

    <!-- Hot Registry Status -->
    <g transform="translate(12, 110)">
      <rect x="0" y="0" width="136" height="130" rx="5" fill="#09141F" stroke="#253550" stroke-width="1" />
      <text x="10" y="16" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="800" font-size="8.5">HOT REGISTRY STATUS</text>
      
      <text x="10" y="32" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="8">• Dynamic Hot-Reload</text>
      <text x="10" y="46" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="8">• Zero Server Restart</text>
      <text x="10" y="60" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="8">• Immediate Triage Route</text>
      <text x="10" y="74" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="8">• Owner: Comp &amp; Ben Lead</text>
      
      <line x1="8" y1="84" x2="128" y2="84" stroke="#1E293B" stroke-width="1" />
      
      <text x="68" y="100" fill="#10B981" font-family="'Inter', sans-serif" font-size="8" font-weight="700" text-anchor="middle">
        Version 2.0 Registered
      </text>
      <text x="68" y="116" fill="#94A3B8" font-family="'Courier New', monospace" font-size="7.5" text-anchor="middle">
        Rule Hash: #7e2a91b
      </text>
    </g>

    <!-- Audit Traceability -->
    <g transform="translate(12, 250)">
      <rect x="0" y="0" width="136" height="70" rx="5" fill="#1A1528" stroke="#8B5CF6" stroke-width="1" />
      <text x="68" y="20" fill="#C4B5FD" font-family="'Inter', sans-serif" font-weight="800" font-size="8.5" text-anchor="middle">
        AUDIT IMMUTABILITY
      </text>
      <text x="10" y="38" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="7.5">Author ID logged</text>
      <text x="10" y="50" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="7.5">Simulation snapshot archived</text>
      <text x="10" y="62" fill="#10B981" font-family="'Inter', sans-serif" font-size="7.5" font-weight="bold">✔ Enterprise Audit Ready</text>
    </g>
