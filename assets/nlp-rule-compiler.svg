        </text>
      </g>

      <!-- Lexical Validation -->
      <g transform="translate(0, 180)">
        <rect x="0" y="0" width="172" height="74" rx="5" fill="#091410" stroke="#10B981" stroke-width="1" />
        <text x="10" y="18" fill="#6EE7B7" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5">LEXICAL VALIDATION</text>
        <text x="10" y="34" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="8">✔ No syntax ambiguity</text>
        <text x="10" y="48" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="8">✔ Target fields mapped to schema</text>
        <text x="10" y="62" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="8">✔ Assigned Rule ID: POL-CUST-5511</text>
      </g>

    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 470,180 L 518,180" fill="none" stroke="#C084FC" stroke-width="2" class="anim-dash-3" />

  <!-- ============================================================== -->
  <!-- STEP 3: AST COMPILER & SIMULATION (X=520 to 740) -->
  <!-- ============================================================== -->
  <g transform="translate(520, 68)">
    <rect x="0" y="0" width="220" height="340" rx="8" fill="url(#card-inner-3)" stroke="#C5A059" stroke-width="1.2" />
    
    <rect x="0" y="0" width="220" height="34" rx="8" fill="#241B10" stroke="#C5A059" stroke-width="1" />
    <text x="14" y="22" fill="#E8C373" font-family="'Inter', sans-serif" font-weight="700" font-size="11">
