<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-canvas-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <linearGradient id="core-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D71921" />
      <stop offset="100%" stop-color="#800A0F" />
    </linearGradient>

    <linearGradient id="orbit-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#916E28" />
    </linearGradient>

    <!-- Animations -->
    <style>
      @keyframes orbit-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes core-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(215, 25, 33, 0.5)); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 24px rgba(215, 25, 33, 0.9)); }
      }
      @keyframes pulse-ring-4 {
        0% { r: 100px; opacity: 0.6; }
        50% { r: 160px; opacity: 0.2; }
        100% { r: 210px; opacity: 0; }
      }
      .orbit-ring {
        transform-origin: 490px 245px;
        animation: orbit-spin 40s linear infinite;
      }
      .core-element {
        transform-origin: 490px 245px;
        animation: core-pulse 4s ease-in-out infinite;
      }
      .ring-wave {
        animation: pulse-ring-4 4s ease-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="980" height="460" fill="url(#bg-canvas-4)" rx="14" />
  
  <!-- Subtle Grid -->
  <g stroke="#16233B" stroke-width="0.7" opacity="0.45">
    <path d="M 0,55 L 980,55 M 0,110 L 980,110 M 0,165 L 980,165 M 0,220 L 980,220 M 0,275 L 980,275 M 0,330 L 980,330 M 0,385 L 980,385" />
    <path d="M 140,0 L 140,460 M 280,0 L 280,460 M 420,0 L 420,460 M 560,0 L 560,460 M 700,0 L 700,460 M 840,0 L 840,460" />
  </g>

  <!-- Border -->
  <rect x="8" y="8" width="964" height="444" fill="none" stroke="#253550" stroke-width="1.2" rx="12" />

  <!-- Diagram Title Header -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="36" height="24" rx="4" fill="#10B981" />
    <text x="18" y="16" fill="#000000" font-family="'Inter', sans-serif" font-weight="900" font-size="12" text-anchor="middle">04</text>
    <text x="46" y="17" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="16">
      Responsible AI, Procedural Fairness &amp; Governance Flywheel
    </text>
    <text x="590" y="16" fill="#34D399" font-family="'Inter', sans-serif" font-weight="600" font-size="11">
      Zero Auto-Mutation Guardrail • Empathetic Notice • 1-Click Dispute SLA
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- FLYWHEEL CENTRAL ORBIT & PULSE RINGS -->
  <!-- ============================================================== -->
  <!-- Pulse Wave Rings -->
  <circle cx="490" cy="245" r="100" fill="none" stroke="#D71921" stroke-width="1.2" class="ring-wave" />

  <!-- Outer Orbit Rings -->
  <circle cx="490" cy="245" r="180" fill="none" stroke="#20334E" stroke-width="1.4" />
  <circle cx="490" cy="245" r="180" fill="none" stroke="url(#orbit-gold)" stroke-width="1.6" stroke-dasharray="14, 28" class="orbit-ring" opacity="0.8" />
  <circle cx="490" cy="245" r="130" fill="none" stroke="#16253C" stroke-width="1" stroke-dasharray="4, 8" />

  <!-- Connecting Spoke Rays from Core to Nodes -->
  <line x1="490" y1="245" x2="160" y2="135" stroke="#1E314D" stroke-width="1.5" stroke-dasharray="3, 5" />
  <line x1="490" y1="245" x2="820" y2="135" stroke="#1E314D" stroke-width="1.5" stroke-dasharray="3, 5" />
  <line x1="490" y1="245" x2="160" y2="355" stroke="#1E314D" stroke-width="1.5" stroke-dasharray="3, 5" />
  <line x1="490" y1="245" x2="820" y2="355" stroke="#1E314D" stroke-width="1.5" stroke-dasharray="3, 5" />
  <line x1="490" y1="245" x2="490" y2="65" stroke="#1E314D" stroke-width="1.5" stroke-dasharray="3, 5" />

  <!-- ============================================================== -->
  <!-- CENTRAL CORE: HUMAN-IN-THE-LOOP SHIELD -->
  <!-- ============================================================== -->
  <g class="core-element">
    <circle cx="490" cy="245" r="74" fill="url(#core-red-grad)" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="490" cy="245" r="66" fill="#180407" stroke="url(#orbit-gold)" stroke-width="1.5" />
    
    <text x="490" y="222" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="11.5" text-anchor="middle" letter-spacing="0.5">
      INVIOLABLE GUARDRAIL
    </text>
    <text x="490" y="238" fill="url(#orbit-gold)" font-family="'Inter', sans-serif" font-weight="800" font-size="10" text-anchor="middle">
      TOOL RECOMMENDS
    </text>
    <text x="490" y="252" fill="url(#orbit-gold)" font-family="'Inter', sans-serif" font-weight="800" font-size="10" text-anchor="middle">
      HUMAN DECIDES
    </text>
    <text x="490" y="270" fill="#FCA5A5" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" text-anchor="middle">
      Zero Automated Mutation
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- NODE 1: EMPATHETIC FAIR NOTICE (Top Center, Y=65) -->
  <!-- ============================================================== -->
  <g transform="translate(365, 50)">
    <rect x="0" y="0" width="250" height="74" rx="8" fill="#0C1526" stroke="#38BDF8" stroke-width="1.2" />
    <rect x="0" y="0" width="250" height="24" rx="8" fill="#0E233E" />
    <circle cx="14" cy="12" r="4" fill="#38BDF8" />
    <text x="24" y="16" fill="#E0F2FE" font-family="'Inter', sans-serif" font-weight="800" font-size="9.5">
      1. EMPATHETIC "FAIR NOTICE" PORTAL
    </text>

    <text x="12" y="38" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8.5">
      • Non-accusatory, dignified tone in English &amp; Arabic
    </text>
    <text x="12" y="52" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8.5">
      • Protects employee standing: routine administrative check
    </text>
    <text x="12" y="66" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600">
      • 5-Day grace window prior to any payroll adjustment
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- NODE 2: 1-CLICK DISPUTE & APPEAL CHANNEL (Top Right, X=710, Y=100) -->
  <!-- ============================================================== -->
  <g transform="translate(700, 100)">
    <rect x="0" y="0" width="245" height="76" rx="8" fill="#0D162B" stroke="#6366F1" stroke-width="1.2" />
    <rect x="0" y="0" width="245" height="24" rx="8" fill="#1C1E40" />
    <circle cx="14" cy="12" r="4" fill="#818CF8" />
    <text x="24" y="16" fill="#EEF2FF" font-family="'Inter', sans-serif" font-weight="800" font-size="9.5">
      2. 1-CLICK EMPLOYEE APPEAL CHANNEL
    </text>

    <text x="12" y="38" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8.5">
      • 1-Click clarification submission on employee portal
    </text>
    <text x="12" y="52" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8.5">
      • Upload missing DHA or GCAA medical certificates
    </text>
    <text x="12" y="66" fill="#A5B4FC" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700">
      • Strict 3-day resolution SLA by neutral HR panel
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- NODE 3: ADVERSE IMPACT & PARITY MONITOR (Bottom Right, X=700, Y=310) -->
  <!-- ============================================================== -->
  <g transform="translate(700, 310)">
    <rect x="0" y="0" width="245" height="82" rx="8" fill="#140E24" stroke="#A855F7" stroke-width="1.2" />
    <rect x="0" y="0" width="245" height="24" rx="8" fill="#24143D" />
    <circle cx="14" cy="12" r="4" fill="#C084FC" />
    <text x="24" y="16" fill="#FAF5FF" font-family="'Inter', sans-serif" font-weight="800" font-size="9.5">
      3. ADVERSE IMPACT PARITY AUDITING
    </text>

    <text x="12" y="38" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8.5">
      • Continuous Disparate Impact Ratio (AIR) tracking
    </text>
    <text x="12" y="52" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8.5">
      • High scrutiny on Executives (93% DOA audit rate)
    </text>
    <text x="12" y="66" fill="#D8B4FE" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700">
      • Zero disparate penalty on frontline staff (14.2% rate)
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- NODE 4: CRYPTOGRAPHIC AUDIT IMMUTABILITY (Bottom Left, X=35, Y=310) -->
  <!-- ============================================================== -->
  <g transform="translate(35, 310)">
    <rect x="0" y="0" width="245" height="82" rx="8" fill="#0A1813" stroke="#10B981" stroke-width="1.2" />
    <rect x="0" y="0" width="245" height="24" rx="8" fill="#0F2D20" />
    <circle cx="14" cy="12" r="4" fill="#34D399" />
    <text x="24" y="16" fill="#ECFDF5" font-family="'Inter', sans-serif" font-weight="800" font-size="9.5">
      4. IMMUTABLE AUDIT TRAIL &amp; LOGS
    </text>

    <text x="12" y="38" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8.5">
      • Cryptographic timestamp &amp; rule version hash
    </text>
    <text x="12" y="52" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8.5">
      • Action log: Approvals with Waiver &amp; Return notes
    </text>
    <text x="12" y="66" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700">
      • Instant export in finding_format.csv schema
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- NODE 5: TRACEABLE POLICY LINEAGE (Top Left, X=35, Y=100) -->
  <!-- ============================================================== -->
  <g transform="translate(35, 100)">
    <rect x="0" y="0" width="245" height="76" rx="8" fill="#1C1410" stroke="#F59E0B" stroke-width="1.2" />
    <rect x="0" y="0" width="245" height="24" rx="8" fill="#332110" />
    <circle cx="14" cy="12" r="4" fill="#FBBF24" />
    <text x="24" y="16" fill="#FFFBEB" font-family="'Inter', sans-serif" font-weight="800" font-size="9.5">
      5. TRACEABLE POLICY LINEAGE
    </text>

    <text x="12" y="38" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8.5">
      • Every flag maps to specific clause in policy handbook
    </text>
    <text x="12" y="52" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="8.5">
      • Mathematical cited evidence: limits vs actual sums
    </text>
    <text x="12" y="66" fill="#FDE68A" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700">
      • Zero hallucination guarantee through AST bindings
    </text>
  </g>

  <!-- Bottom Certification Tag -->
  <g transform="translate(330, 416)">
    <rect x="0" y="0" width="320" height="24" rx="5" fill="#0C1424" stroke="#253550" stroke-width="1" />
    <text x="160" y="16" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">
      UAE Federal Decree-Law No. 45 (2021) • PDPL &amp; GDPR Certified
    </text>
  </g>

</svg>
