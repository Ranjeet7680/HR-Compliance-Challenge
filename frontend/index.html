<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emirates Group HR Continuous Compliance Intelligence</title>
    <!-- Google Fonts: Inter & Cairo (for pristine Arabic & English) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              emirates: {
                red: '#D71921',
                redDark: '#B31017',
                gold: '#C5A059',
                goldLight: '#E8D5AB',
                goldDark: '#99732B',
                dark: '#0B0F19',
                card: '#111827',
                border: '#1F2937'
              }
            },
            fontFamily: {
              sans: ['Inter', 'Cairo', 'sans-serif'],
              cairo: ['Cairo', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0B0F19;
        color: #F3F4F6;
        font-family: 'Inter', 'Cairo', sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #111827;
      }
      ::-webkit-scrollbar-thumb {
        background: #374151;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4B5563;
      }
      [dir="rtl"] {
        font-family: 'Cairo', 'Inter', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
